name: Publish to GHCR

on:
  push:
    tags:
      - "v*"
  # Manual runs publish :latest only (no version tag) and, unlike a tag push, don't also fire the
  # PyPI workflow - used to republish the image without cutting a release.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/opnsense-mcp-server"
          {
            echo "tags<<EOF"
            echo "${image}:latest"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${image}:${GITHUB_REF_NAME#v}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
